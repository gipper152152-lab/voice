<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>VoiceRoom</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/peerjs/1.5.4/peerjs.min.js"></script>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap');

  * { margin: 0; padding: 0; box-sizing: border-box; }

  :root {
    --bg: #0D0E14;
    --surface: #16181F;
    --card: #1E2029;
    --border: #2A2D3A;
    --accent: #5865F2;
    --accent-hover: #4752C4;
    --accent-dim: rgba(88, 101, 242, 0.15);
    --green: #23A55A;
    --green-dim: rgba(35, 165, 90, 0.15);
    --red: #F23F43;
    --red-dim: rgba(242, 63, 67, 0.15);
    --text: #E3E5E8;
    --muted: #949BA4;
    --dim: #5C6068;
    --radius: 12px;
  }

  body {
    background: var(--bg);
    color: var(--text);
    font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
  }

  header {
    padding: 14px 24px;
    border-bottom: 1px solid var(--border);
    display: flex;
    align-items: center;
    gap: 12px;
    background: var(--surface);
    flex-shrink: 0;
  }

  .logo {
    width: 32px; height: 32px;
    background: var(--accent);
    border-radius: 8px;
    display: flex; align-items: center; justify-content: center;
    flex-shrink: 0;
  }
  .logo svg { width: 18px; height: 18px; fill: white; }

  h1 { font-size: 16px; font-weight: 600; letter-spacing: -0.2px; }

  .header-right {
    margin-left: auto;
    display: flex;
    align-items: center;
    gap: 10px;
  }

  .room-link-box {
    display: flex;
    align-items: center;
    gap: 6px;
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 5px 10px;
    font-size: 12px;
    color: var(--muted);
    cursor: pointer;
    transition: border-color 0.15s;
    max-width: 260px;
  }
  .room-link-box:hover { border-color: var(--accent); color: var(--text); }
  .room-link-box svg { width: 13px; height: 13px; fill: currentColor; flex-shrink: 0; }
  .room-link-text { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }

  .copied-toast {
    font-size: 11px;
    color: var(--green);
    opacity: 0;
    transition: opacity 0.2s;
    white-space: nowrap;
  }
  .copied-toast.show { opacity: 1; }

  main { flex: 1; display: flex; overflow: hidden; min-height: 0; }

  .sidebar {
    width: 220px;
    background: var(--surface);
    border-right: 1px solid var(--border);
    display: flex;
    flex-direction: column;
    padding: 16px 0 0;
    flex-shrink: 0;
    overflow-y: auto;
  }

  .channel-label {
    font-size: 11px;
    font-weight: 600;
    color: var(--dim);
    text-transform: uppercase;
    letter-spacing: 0.8px;
    padding: 0 16px;
    margin-bottom: 6px;
  }

  .channel {
    display: flex; align-items: center; gap: 8px;
    padding: 7px 12px;
    margin: 0 8px;
    border-radius: 6px;
    cursor: pointer;
    color: var(--muted);
    font-size: 14px;
    background: var(--accent-dim);
    color: var(--accent);
    margin-bottom: 12px;
  }
  .channel svg { width: 15px; height: 15px; fill: currentColor; flex-shrink: 0; }

  .participants-section-label {
    font-size: 11px;
    font-weight: 600;
    color: var(--dim);
    text-transform: uppercase;
    letter-spacing: 0.8px;
    padding: 0 16px;
    margin-bottom: 4px;
  }

  .participant {
    display: flex; align-items: center; gap: 8px;
    padding: 5px 12px;
    font-size: 13px;
    color: var(--muted);
    border-radius: 6px;
    margin: 0 4px;
    transition: background 0.1s;
  }
  .participant:hover { background: var(--card); }

  .avatar {
    width: 28px; height: 28px; border-radius: 50%;
    display: flex; align-items: center; justify-content: center;
    font-size: 11px; font-weight: 600; flex-shrink: 0;
  }
  .avatar.speaking-ring { box-shadow: 0 0 0 2px var(--green); }

  .participant-name { flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }

  .mic-status { width: 14px; height: 14px; flex-shrink: 0; }
  .mic-status svg { width: 14px; height: 14px; }
  .mic-status.muted svg { fill: var(--red); }
  .mic-status.unmuted svg { fill: var(--dim); }

  .content {
    flex: 1; display: flex; flex-direction: column; overflow: hidden; min-height: 0;
  }

  .status-bar {
    display: flex; align-items: center; gap: 8px;
    padding: 7px 20px;
    background: var(--green-dim);
    border-bottom: 1px solid rgba(35,165,90,0.2);
    font-size: 12px; color: var(--green); font-weight: 500;
    flex-shrink: 0;
  }
  .status-bar.connecting {
    background: rgba(254,231,92,0.1);
    border-bottom-color: rgba(254,231,92,0.2);
    color: #FEE75C;
  }
  .status-bar.error {
    background: var(--red-dim);
    border-bottom-color: rgba(242,63,67,0.2);
    color: var(--red);
  }
  .status-dot {
    width: 7px; height: 7px; border-radius: 50%;
    background: currentColor;
    animation: pulse 2s ease-in-out infinite;
    flex-shrink: 0;
  }
  @keyframes pulse { 0%,100%{opacity:1} 50%{opacity:0.4} }

  .video-grid {
    flex: 1; padding: 20px;
    display: grid; gap: 12px;
    overflow-y: auto;
    align-content: start;
    grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
  }

  .video-tile {
    background: var(--card);
    border-radius: var(--radius);
    border: 2px solid var(--border);
    aspect-ratio: 16/9;
    position: relative; overflow: hidden;
    transition: border-color 0.2s;
  }
  .video-tile.speaking { border-color: var(--green); }

  .video-tile video {
    width: 100%; height: 100%; object-fit: cover; display: block;
  }

  .no-video-overlay {
    position: absolute; inset: 0;
    display: flex; flex-direction: column;
    align-items: center; justify-content: center; gap: 10px;
    background: var(--card);
  }

  .big-avatar {
    width: 68px; height: 68px; border-radius: 50%;
    display: flex; align-items: center; justify-content: center;
    font-size: 24px; font-weight: 600;
  }
  .big-avatar.speaking-ring { box-shadow: 0 0 0 3px var(--green); }

  .wave-bars {
    display: flex; align-items: center; gap: 3px; height: 20px;
    opacity: 0; transition: opacity 0.2s;
  }
  .wave-bars.active { opacity: 1; }
  .bar {
    width: 3px; border-radius: 2px; background: var(--green);
    animation: wave 0.8s ease-in-out infinite;
  }
  .bar:nth-child(2){animation-delay:.1s}
  .bar:nth-child(3){animation-delay:.2s}
  .bar:nth-child(4){animation-delay:.1s}
  @keyframes wave { 0%,100%{height:4px} 50%{height:18px} }

  .tile-label {
    position: absolute; bottom: 10px; left: 10px;
    background: rgba(0,0,0,0.65);
    color: white; font-size: 12px; font-weight: 500;
    padding: 3px 8px; border-radius: 4px;
    backdrop-filter: blur(4px);
    display: flex; align-items: center; gap: 5px;
  }
  .tile-muted { fill: var(--red); width: 11px; height: 11px; }

  .empty-placeholder {
    display: flex; flex-direction: column;
    align-items: center; justify-content: center;
    gap: 14px; color: var(--dim);
    grid-column: 1/-1;
    min-height: 220px;
    text-align: center;
  }
  .empty-placeholder svg { width: 44px; height: 44px; fill: var(--dim); opacity: 0.4; }
  .empty-placeholder p { font-size: 14px; line-height: 1.6; }
  .empty-placeholder .share-hint {
    font-size: 13px; color: var(--muted);
    background: var(--card); border: 1px solid var(--border);
    border-radius: 8px; padding: 10px 16px;
    font-family: monospace;
  }

  .controls-bar {
    padding: 14px 24px; background: var(--surface);
    border-top: 1px solid var(--border);
    display: flex; align-items: center; justify-content: center; gap: 10px;
    flex-shrink: 0;
  }

  .ctrl-btn {
    width: 46px; height: 46px; border-radius: 12px; border: none;
    cursor: pointer; display: flex; align-items: center; justify-content: center;
    transition: background 0.15s, transform 0.1s; position: relative;
  }
  .ctrl-btn:active { transform: scale(0.95); }
  .ctrl-btn svg { width: 20px; height: 20px; pointer-events: none; }

  .ctrl-btn.off { background: var(--card); border: 1px solid var(--border); }
  .ctrl-btn.off svg { fill: var(--text); }
  .ctrl-btn.off:hover { background: #262835; }

  .ctrl-btn.muted { background: var(--red-dim); border: 1px solid rgba(242,63,67,0.3); }
  .ctrl-btn.muted svg { fill: var(--red); }
  .ctrl-btn.muted:hover { background: rgba(242,63,67,0.25); }

  .ctrl-btn.active { background: var(--accent-dim); border: 1px solid rgba(88,101,242,0.3); }
  .ctrl-btn.active svg { fill: var(--accent); }
  .ctrl-btn.active:hover { background: rgba(88,101,242,0.25); }

  .ctrl-btn.danger { background: var(--red); border: none; }
  .ctrl-btn.danger svg { fill: white; }
  .ctrl-btn.danger:hover { background: #D63538; }

  .tooltip {
    position: absolute; bottom: 52px; left: 50%;
    transform: translateX(-50%);
    background: #111; color: white;
    font-size: 11px; padding: 4px 8px;
    border-radius: 4px; white-space: nowrap;
    pointer-events: none; opacity: 0; transition: opacity 0.15s; z-index: 10;
  }
  .ctrl-btn:hover .tooltip { opacity: 1; }

  /* JOIN OVERLAY */
  .join-overlay {
    position: fixed; inset: 0;
    background: rgba(13,14,20,0.97);
    display: flex; align-items: center; justify-content: center;
    z-index: 100; backdrop-filter: blur(8px);
  }
  .join-card {
    background: var(--card); border: 1px solid var(--border);
    border-radius: 20px; padding: 36px 40px;
    width: 420px; display: flex; flex-direction: column;
    align-items: center; gap: 0;
  }
  .join-logo {
    width: 52px; height: 52px; background: var(--accent);
    border-radius: 14px; display: flex; align-items: center; justify-content: center;
    margin-bottom: 18px;
  }
  .join-logo svg { width: 28px; height: 28px; fill: white; }
  .join-card h2 { font-size: 21px; font-weight: 600; margin-bottom: 8px; }
  .join-card p { color: var(--muted); font-size: 13px; text-align: center; margin-bottom: 24px; line-height: 1.6; }

  .room-badge {
    background: var(--surface); border: 1px solid var(--border);
    border-radius: 8px; padding: 8px 14px;
    font-size: 13px; color: var(--accent); font-weight: 500;
    margin-bottom: 22px; display: flex; align-items: center; gap: 8px;
    width: 100%;
  }
  .room-badge svg { width: 14px; height: 14px; fill: var(--accent); flex-shrink: 0; }
  .room-badge span { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; flex: 1; }

  .preview-box {
    width: 100%; aspect-ratio: 16/9;
    background: #0a0b10; border-radius: 10px; border: 1px solid var(--border);
    margin-bottom: 18px; overflow: hidden; position: relative;
  }
  .preview-box video { width: 100%; height: 100%; object-fit: cover; }
  .preview-no-cam {
    position: absolute; inset: 0;
    display: flex; flex-direction: column;
    align-items: center; justify-content: center; gap: 8px;
    color: var(--muted); font-size: 13px;
  }
  .preview-no-cam svg { width: 32px; height: 32px; fill: var(--dim); }

  .name-input {
    width: 100%; background: var(--surface); border: 1px solid var(--border);
    border-radius: 8px; color: var(--text); font-size: 14px;
    padding: 10px 14px; margin-bottom: 12px; outline: none;
    transition: border-color 0.15s; font-family: inherit;
  }
  .name-input:focus { border-color: var(--accent); }

  .device-row { display: flex; gap: 8px; width: 100%; margin-bottom: 18px; }
  .device-select {
    flex: 1; background: var(--surface); border: 1px solid var(--border);
    border-radius: 8px; color: var(--text); font-size: 12px;
    padding: 8px 10px; outline: none; cursor: pointer; font-family: inherit;
    transition: border-color 0.15s;
  }
  .device-select:focus { border-color: var(--accent); }

  .join-btn {
    width: 100%; background: var(--accent); color: white;
    border: none; border-radius: 10px; padding: 13px;
    font-size: 15px; font-weight: 600; cursor: pointer;
    transition: background 0.15s, transform 0.1s; font-family: inherit;
  }
  .join-btn:hover { background: var(--accent-hover); }
  .join-btn:active { transform: scale(0.99); }
  .join-btn:disabled { opacity: 0.5; cursor: not-allowed; }

  @media (max-width: 600px) {
    .sidebar { display: none; }
    .join-card { width: 92vw; padding: 28px 20px; }
    .video-grid { grid-template-columns: 1fr; }
  }
</style>
</head>
<body>

<!-- JOIN OVERLAY -->
<div class="join-overlay" id="joinOverlay">
  <div class="join-card">
    <div class="join-logo">
      <svg viewBox="0 0 24 24"><path d="M12 3a9 9 0 100 18A9 9 0 0012 3zm-1 13H9V8h2v8zm4 0h-2V8h2v8z"/></svg>
    </div>
    <h2>Войти в комнату</h2>
    <p>Поделитесь ссылкой с друзьями — они смогут подключиться к вам напрямую</p>

    <div class="room-badge">
      <svg viewBox="0 0 24 24"><path d="M10 13a5 5 0 007.54.54l3-3a5 5 0 00-7.07-7.07l-1.72 1.71"/><path d="M14 11a5 5 0 00-7.54-.54l-3 3a5 5 0 007.07 7.07l1.71-1.71" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>
      <span id="roomUrlDisplay">Загрузка...</span>
    </div>

    <div class="preview-box">
      <video id="previewVideo" autoplay muted playsinline></video>
      <div class="preview-no-cam" id="previewNoCam">
        <svg viewBox="0 0 24 24"><path d="M18 10.48V6c0-1.1-.9-2-2-2H4c-1.1 0-2 .9-2 2v12c0 1.1.9 2 2 2h12c1.1 0 2-.9 2-2v-4.48l4 3.98v-11l-4 3.5zm-2-.79V18H4V6h12v3.69z"/></svg>
        <span>Камера недоступна</span>
      </div>
    </div>

    <input class="name-input" id="nameInput" type="text" placeholder="Ваше имя" maxlength="24" autocomplete="off">

    <div class="device-row">
      <select class="device-select" id="micSelect"><option>🎤 Микрофон...</option></select>
      <select class="device-select" id="camSelect"><option>📷 Камера...</option></select>
    </div>

    <button class="join-btn" id="joinBtn">Подключиться</button>
  </div>
</div>

<!-- HEADER -->
<header>
  <div class="logo">
    <svg viewBox="0 0 24 24"><path d="M12 3a9 9 0 100 18A9 9 0 0012 3zm-1 13H9V8h2v8zm4 0h-2V8h2v8z"/></svg>
  </div>
  <h1>VoiceRoom</h1>
  <div class="header-right">
    <div class="room-link-box" id="copyLinkBtn" title="Скопировать ссылку">
      <svg viewBox="0 0 24 24"><path d="M16 1H4c-1.1 0-2 .9-2 2v14h2V3h12V1zm3 4H8c-1.1 0-2 .9-2 2v14c0 1.1.9 2 2 2h11c1.1 0 2-.9 2-2V7c0-1.1-.9-2-2-2zm0 16H8V7h11v14z"/></svg>
      <span class="room-link-text" id="headerRoomUrl">—</span>
    </div>
    <span class="copied-toast" id="copiedToast">✓ Скопировано</span>
  </div>
</header>

<main>
  <!-- SIDEBAR -->
  <div class="sidebar">
    <div style="padding: 0 12px; margin-bottom: 12px;">
      <div class="channel-label" style="margin-bottom:6px">Голосовые</div>
      <div class="channel">
        <svg viewBox="0 0 24 24"><path d="M12 14c1.66 0 3-1.34 3-3V5c0-1.66-1.34-3-3-3S9 3.34 9 5v6c0 1.66 1.34 3 3 3zm5.91-3c-.49 0-.9.36-.98.85C16.52 14.2 14.47 16 12 16s-4.52-1.8-4.93-4.15A.998.998 0 009.1 12c-.61 0-1.09.54-1 1.14.49 3 2.89 5.35 5.91 5.78V21c0 .55.45 1 1 1s1-.45 1-1v-2.08c3.02-.43 5.42-2.78 5.91-5.78.09-.6-.4-1.14-1.01-1.14z"/></svg>
        Общий
      </div>
    </div>
    <div class="participants-section-label">Участники</div>
    <div id="sideParticipants"></div>
  </div>

  <!-- CONTENT -->
  <div class="content">
    <div id="statusBar" class="status-bar connecting" style="display:none">
      <div class="status-dot"></div>
      <span id="statusText">Подключение...</span>
    </div>

    <div class="video-grid" id="videoGrid">
      <div class="empty-placeholder" id="emptyHint">
        <svg viewBox="0 0 24 24"><path d="M16 11c1.66 0 2.99-1.34 2.99-3S17.66 5 16 5c-1.66 0-3 1.34-3 3s1.34 3 3 3zm-8 0c1.66 0 2.99-1.34 2.99-3S9.66 5 8 5C6.34 5 5 6.34 5 8s1.34 3 3 3zm0 2c-2.33 0-7 1.17-7 3.5V19h14v-2.5c0-2.33-4.67-3.5-7-3.5zm8 0c-.29 0-.62.02-.97.05 1.16.84 1.97 1.97 1.97 3.45V19h6v-2.5c0-2.33-4.67-3.5-7-3.5z"/></svg>
        <p>Войдите в комнату и поделитесь ссылкой<br>чтобы друзья смогли подключиться</p>
      </div>
    </div>

    <div class="controls-bar">
      <button class="ctrl-btn off" id="micBtn">
        <svg id="micSvg" viewBox="0 0 24 24"><path d="M12 14c1.66 0 3-1.34 3-3V5c0-1.66-1.34-3-3-3S9 3.34 9 5v6c0 1.66 1.34 3 3 3zm5.91-3c-.49 0-.9.36-.98.85C16.52 14.2 14.47 16 12 16s-4.52-1.8-4.93-4.15A.998.998 0 009.1 12c-.61 0-1.09.54-1 1.14.49 3 2.89 5.35 5.91 5.78V21c0 .55.45 1 1 1s1-.45 1-1v-2.08c3.02-.43 5.42-2.78 5.91-5.78.09-.6-.4-1.14-1.01-1.14z"/></svg>
        <span class="tooltip" id="micTip">Выключить микрофон</span>
      </button>
      <button class="ctrl-btn off" id="camBtn">
        <svg id="camSvg" viewBox="0 0 24 24"><path d="M17 10.5V7c0-.55-.45-1-1-1H4c-.55 0-1 .45-1 1v10c0 .55.45 1 1 1h12c.55 0 1-.45 1-1v-3.5l4 4v-11l-4 4z"/></svg>
        <span class="tooltip" id="camTip">Выключить камеру</span>
      </button>
      <button class="ctrl-btn off" id="screenBtn">
        <svg viewBox="0 0 24 24"><path d="M21 3H3c-1.11 0-2 .89-2 2v12c0 1.1.89 2 2 2h5v2h8v-2h5c1.1 0 1.99-.9 1.99-2L23 5c0-1.11-.9-2-2-2zm0 14H3V5h18v12z"/></svg>
        <span class="tooltip">Демонстрация экрана</span>
      </button>
      <button class="ctrl-btn danger" id="leaveBtn">
        <svg viewBox="0 0 24 24"><path d="M10.09 15.59L11.5 17l5-5-5-5-1.41 1.41L12.67 11H3v2h9.67l-2.58 2.59zM19 3H5c-1.11 0-2 .9-2 2v4h2V5h14v14H5v-4H3v4c0 1.1.89 2 2 2h14c1.1 0 2-.9 2-2V5c0-1.1-.9-2-2-2z"/></svg>
        <span class="tooltip">Покинуть</span>
      </button>
    </div>
  </div>
</main>

<script>
// ─── HELPERS ───────────────────────────────────────────────────────────────
const COLORS = ['#5865F2','#57F287','#FEE75C','#EB459E','#ED4245','#7289DA','#00B4D8'];
const pickColor = n => COLORS[Math.abs([...n].reduce((s,c)=>s+c.charCodeAt(0),0)) % COLORS.length];
const initials = n => n.trim().split(/\s+/).map(w=>w[0]).join('').toUpperCase().slice(0,2)||'?';

// ─── ROOM ID ───────────────────────────────────────────────────────────────
function getRoomId() {
  const h = location.hash.slice(1);
  if (h) return h;
  const id = 'room-' + Math.random().toString(36).slice(2,8).toUpperCase();
  location.hash = id;
  return id;
}
const ROOM_ID = getRoomId();
const roomUrl = location.href.split('#')[0] + '#' + ROOM_ID;

// ─── STATE ─────────────────────────────────────────────────────────────────
let localStream = null;
let localName = '';
let micMuted = false;
let camOff = false;
let screenSharing = false;
let screenStream = null;
let myPeer = null;
let myPeerId = null;

// peers[peerId] = { call, stream, name, micMuted, speaking }
const peers = {};

// ─── UI INIT ───────────────────────────────────────────────────────────────
document.getElementById('roomUrlDisplay').textContent = roomUrl;
document.getElementById('headerRoomUrl').textContent = roomUrl;

document.getElementById('copyLinkBtn').onclick = () => {
  navigator.clipboard.writeText(roomUrl).then(() => {
    const t = document.getElementById('copiedToast');
    t.classList.add('show');
    setTimeout(() => t.classList.remove('show'), 2000);
  });
};

// ─── DEVICES ───────────────────────────────────────────────────────────────
async function loadDevices() {
  try {
    const tmp = await navigator.mediaDevices.getUserMedia({audio:true, video:true});
    tmp.getTracks().forEach(t => t.stop());
  } catch(e) {}
  try {
    const devices = await navigator.mediaDevices.enumerateDevices();
    const mics = devices.filter(d => d.kind==='audioinput');
    const cams = devices.filter(d => d.kind==='videoinput');
    const micSel = document.getElementById('micSelect');
    const camSel = document.getElementById('camSelect');
    micSel.innerHTML = mics.map((d,i)=>`<option value="${d.deviceId}">${d.label||'Микрофон '+(i+1)}</option>`).join('');
    camSel.innerHTML = cams.map((d,i)=>`<option value="${d.deviceId}">${d.label||'Камера '+(i+1)}</option>`).join('');
  } catch(e) {}
}

async function startPreview() {
  try {
    const s = await navigator.mediaDevices.getUserMedia({video:true, audio:false});
    document.getElementById('previewVideo').srcObject = s;
    document.getElementById('previewNoCam').style.display = 'none';
  } catch(e) {}
}

loadDevices();
startPreview();

// ─── JOIN ──────────────────────────────────────────────────────────────────
document.getElementById('joinBtn').onclick = doJoin;
document.getElementById('nameInput').onkeydown = e => { if (e.key==='Enter') doJoin(); };

async function doJoin() {
  const name = document.getElementById('nameInput').value.trim() || 'Гость';
  localName = name;

  const btn = document.getElementById('joinBtn');
  btn.disabled = true;
  btn.textContent = 'Получаем доступ к устройствам...';

  const micId = document.getElementById('micSelect').value;
  const camId = document.getElementById('camSelect').value;
  const constraints = {
    audio: micId ? {deviceId:{exact:micId}} : true,
    video: camId ? {deviceId:{exact:camId}} : true,
  };

  try {
    localStream = await navigator.mediaDevices.getUserMedia(constraints);
  } catch(e) {
    try { localStream = await navigator.mediaDevices.getUserMedia({audio:true}); } catch(e2) {
      localStream = new MediaStream();
    }
  }

  // Stop preview
  const pv = document.getElementById('previewVideo');
  if (pv.srcObject) { pv.srcObject.getTracks().forEach(t => t.stop()); pv.srcObject = null; }

  document.getElementById('joinOverlay').style.display = 'none';
  document.getElementById('statusBar').style.display = 'flex';

  renderLocalTile();
  setupVAD();
  initPeer(name);
}

// ─── VAD ───────────────────────────────────────────────────────────────────
function setupVAD() {
  try {
    const ctx = new (window.AudioContext||window.webkitAudioContext)();
    const analyser = ctx.createAnalyser();
    analyser.fftSize = 512;
    ctx.createMediaStreamSource(localStream).connect(analyser);
    const data = new Uint8Array(analyser.frequencyBinCount);
    let wasSpeaking = false;
    setInterval(() => {
      analyser.getByteFrequencyData(data);
      const vol = data.reduce((a,b)=>a+b,0)/data.length;
      const speaking = vol > 12 && !micMuted;
      if (speaking !== wasSpeaking) {
        wasSpeaking = speaking;
        setSpeaking('local', speaking);
        broadcastMeta();
      }
    }, 120);
  } catch(e) {}
}

// ─── PEER SETUP ────────────────────────────────────────────────────────────
function initPeer(name) {
  setStatus('connecting', 'Подключение к серверу...');

  // PeerJS – using their free cloud server
  myPeer = new Peer(undefined, {
    host: 'peerjs.com',
    port: 443,
    path: '/',
    secure: true,
    debug: 1,
  });

  myPeer.on('open', id => {
    myPeerId = id;
    setStatus('connected', `Подключено · ${countParticipants()} участник(ов)`);

    // Announce ourselves via URL hash signaling room
    // The room host broadcasts via a shared "room peer" ID derived from ROOM_ID
    const hostPeerId = 'vrhost-' + ROOM_ID;

    if (id === hostPeerId) {
      // We ARE the host
      console.log('I am the host');
    } else {
      // Try connecting to host
      connectToHostAndGet(hostPeerId, name);
    }

    // Also try to be host if not taken (race condition okay – PeerJS will error)
    tryBecomeHost(hostPeerId, name);
  });

  myPeer.on('call', call => {
    // Incoming call from someone
    const callerName = call.metadata?.name || 'Участник';
    call.answer(localStream);
    handleCall(call, callerName);
  });

  myPeer.on('connection', conn => {
    // Data channel: peer list sharing
    conn.on('data', data => handleData(data, conn.peer));
  });

  myPeer.on('error', err => {
    console.warn('PeerJS error:', err.type, err);
    if (err.type === 'unavailable-id') {
      // Host slot taken – that's fine, just connect as client
    }
    if (err.type === 'peer-unavailable') {
      // Can't reach host yet – will connect when someone calls us
    }
    if (err.type === 'network' || err.type === 'server-error') {
      setStatus('error', 'Нет соединения с сервером');
    }
  });
}

// host peer ID is deterministic from room code
function tryBecomeHost(hostPeerId, name) {
  const hostPeer = new Peer(hostPeerId, {
    host: 'peerjs.com', port: 443, path: '/', secure: true, debug: 0,
  });
  hostPeer.on('open', () => {
    console.log('Claimed host slot:', hostPeerId);
    // As host, when new peers connect they'll call us, we handle via myPeer.on('call')
    hostPeer.on('call', call => {
      const callerName = call.metadata?.name || 'Участник';
      call.answer(localStream);
      handleCall(call, callerName);
      // Tell new peer about existing peers
      const conn = hostPeer.connect(call.peer);
      conn.on('open', () => {
        conn.send({ type: 'peers', list: getPeerList() });
      });
    });
    hostPeer.on('connection', conn => {
      conn.on('data', data => handleData(data, conn.peer));
    });
    hostPeer.on('error', () => {});
  });
  hostPeer.on('error', () => {}); // already taken – ignore
}

function connectToHostAndGet(hostPeerId, name) {
  // Call the host
  setTimeout(() => {
    try {
      const call = myPeer.call(hostPeerId, localStream, { metadata: { name } });
      if (call) handleCall(call, 'Хост');

      // Ask host for peer list
      const conn = myPeer.connect(hostPeerId);
      conn.on('open', () => { conn.send({ type: 'hello', name }); });
      conn.on('data', data => handleData(data, hostPeerId));
    } catch(e) {}
  }, 800);
}

function handleData(data, fromId) {
  if (data.type === 'peers') {
    // Connect to each peer we don't know
    for (const p of data.list) {
      if (p.id !== myPeerId && !peers[p.id]) {
        callPeer(p.id, p.name);
      }
    }
  }
  if (data.type === 'meta') {
    if (peers[fromId]) {
      peers[fromId].micMuted = data.micMuted;
      peers[fromId].speaking = data.speaking;
      updatePeerSidebarEntry(fromId);
      setSpeaking(fromId, data.speaking);
    }
  }
}

function callPeer(peerId, peerName) {
  try {
    const call = myPeer.call(peerId, localStream, { metadata: { name: localName } });
    if (call) {
      peers[peerId] = peers[peerId] || { name: peerName, micMuted: false, speaking: false };
      handleCall(call, peerName, peerId);
    }
  } catch(e) {}
}

function handleCall(call, peerName, knownId) {
  const peerId = knownId || call.peer;
  if (!peers[peerId]) {
    peers[peerId] = { call, name: peerName, stream: null, micMuted: false, speaking: false };
  } else {
    peers[peerId].call = call;
    peers[peerId].name = peerName;
  }

  call.on('stream', remoteStream => {
    peers[peerId].stream = remoteStream;
    renderPeerTile(peerId, peerName, remoteStream);
    updateSidebar();
    setStatus('connected', `Подключено · ${countParticipants()} участник(ов)`);
    broadcastMeta();
  });

  call.on('close', () => removePeer(peerId));
  call.on('error', () => removePeer(peerId));
}

// ─── META BROADCAST ────────────────────────────────────────────────────────
function broadcastMeta() {
  const meta = { type: 'meta', micMuted, speaking: false };
  for (const p of Object.values(peers)) {
    try { p.conn?.send(meta); } catch(e) {}
  }
}

// ─── PEER UTILITIES ────────────────────────────────────────────────────────
function getPeerList() {
  const list = [{ id: myPeerId, name: localName }];
  for (const [id, p] of Object.entries(peers)) {
    list.push({ id, name: p.name });
  }
  return list;
}

function countParticipants() {
  return 1 + Object.keys(peers).length;
}

function removePeer(peerId) {
  if (peers[peerId]) {
    try { peers[peerId].call?.close(); } catch(e) {}
    delete peers[peerId];
  }
  document.getElementById('tile-' + peerId)?.remove();
  updateSidebar();
  setStatus('connected', `Подключено · ${countParticipants()} участник(ов)`);
}

// ─── STATUS ────────────────────────────────────────────────────────────────
function setStatus(type, text) {
  const bar = document.getElementById('statusBar');
  bar.style.display = 'flex';
  bar.className = 'status-bar ' + type;
  document.getElementById('statusText').textContent = text;
}

// ─── TILES ─────────────────────────────────────────────────────────────────
function renderLocalTile() {
  document.getElementById('emptyHint')?.remove();
  const tile = makeTile('local', localName, localStream, true);
  document.getElementById('videoGrid').appendChild(tile);
  updateSidebar();
}

function renderPeerTile(peerId, peerName, stream) {
  let tile = document.getElementById('tile-' + peerId);
  if (!tile) {
    tile = makeTile(peerId, peerName, stream, false);
    document.getElementById('videoGrid').appendChild(tile);
  } else {
    const v = tile.querySelector('video');
    v.srcObject = stream;
    refreshVideoOverlay(peerId, stream);
  }
}

function makeTile(id, name, stream, isLocal) {
  const tile = document.createElement('div');
  tile.className = 'video-tile';
  tile.id = 'tile-' + id;

  const video = document.createElement('video');
  video.autoplay = true;
  video.playsInline = true;
  if (isLocal) video.muted = true;
  video.srcObject = stream;
  tile.appendChild(video);

  // No-video overlay
  const ov = document.createElement('div');
  ov.className = 'no-video-overlay';
  ov.id = 'ov-' + id;

  const av = document.createElement('div');
  av.className = 'big-avatar';
  av.id = 'av-' + id;
  const col = pickColor(name);
  av.style.background = col + '33';
  av.style.color = col;
  av.textContent = initials(name);

  const bars = document.createElement('div');
  bars.className = 'wave-bars';
  bars.id = 'bars-' + id;
  for (let i=0;i<4;i++) {
    const b = document.createElement('div');
    b.className = 'bar';
    bars.appendChild(b);
  }
  ov.appendChild(av);
  ov.appendChild(bars);
  tile.appendChild(ov);

  // Label
  const label = document.createElement('div');
  label.className = 'tile-label';
  label.id = 'lbl-' + id;
  label.innerHTML = `<span>${isLocal ? 'Вы (' + name + ')' : name}</span>`;
  tile.appendChild(label);

  refreshVideoOverlay(id, stream);
  return tile;
}

function refreshVideoOverlay(id, stream) {
  const tile = document.getElementById('tile-' + id);
  const ov = document.getElementById('ov-' + id);
  const v = tile?.querySelector('video');
  if (!tile || !ov || !v) return;
  const hasVideo = stream && stream.getVideoTracks().some(t => t.enabled && t.readyState === 'live');
  ov.style.display = hasVideo ? 'none' : 'flex';
}

// ─── SPEAKING ──────────────────────────────────────────────────────────────
function setSpeaking(id, speaking) {
  document.getElementById('tile-' + id)?.classList.toggle('speaking', speaking);
  document.getElementById('bars-' + id)?.classList.toggle('active', speaking);
  document.getElementById('av-' + id)?.classList.toggle('speaking-ring', speaking);
}

// ─── SIDEBAR ───────────────────────────────────────────────────────────────
function updateSidebar() {
  const container = document.getElementById('sideParticipants');
  container.innerHTML = '';

  const all = [{ id: 'local', name: 'Вы (' + localName + ')', micMuted, speaking: false }];
  for (const [id, p] of Object.entries(peers)) {
    all.push({ id, name: p.name, micMuted: p.micMuted, speaking: p.speaking });
  }

  for (const p of all) {
    const col = pickColor(p.name);
    const div = document.createElement('div');
    div.className = 'participant';
    div.id = 'side-' + p.id;
    div.innerHTML = `
      <div class="avatar${p.speaking?' speaking-ring':''}" style="background:${col}33;color:${col}">${initials(p.name)}</div>
      <span class="participant-name">${p.name}</span>
      <div class="mic-status ${p.micMuted?'muted':'unmuted'}">
        <svg viewBox="0 0 24 24" fill="currentColor">
          ${p.micMuted
            ? '<path d="M19 11h-1.7c0 .74-.16 1.43-.43 2.05l1.23 1.23c.56-.98.9-2.09.9-3.28zm-4.02.17c0-.06.02-.11.02-.17V5c0-1.66-1.34-3-3-3S9 3.34 9 5v.18l5.98 5.99zM4.27 3L3 4.27l6.01 6.01V11c0 1.66 1.33 3 2.99 3 .22 0 .44-.03.65-.08l1.66 1.66c-.71.33-1.5.52-2.31.52-2.76 0-5.3-2.1-5.3-5.1H5c0 3.41 2.72 6.23 6 6.72V21h2v-3.28c.91-.13 1.77-.45 2.54-.9L19.73 21 21 19.73 4.27 3z"/>'
            : '<path d="M12 14c1.66 0 3-1.34 3-3V5c0-1.66-1.34-3-3-3S9 3.34 9 5v6c0 1.66 1.34 3 3 3zm5.91-3c-.49 0-.9.36-.98.85C16.52 14.2 14.47 16 12 16s-4.52-1.8-4.93-4.15-.49-.85-.98-.85c-.61 0-1.09.54-1 1.14.49 3 2.89 5.35 5.91 5.78V21c0 .55.45 1 1 1s1-.45 1-1v-2.08c3.02-.43 5.42-2.78 5.91-5.78.09-.6-.4-1.14-1.01-1.14z"/>'}
        </svg>
      </div>`;
    container.appendChild(div);
  }
}

function updatePeerSidebarEntry(peerId) {
  // Re-render sidebar
  updateSidebar();
}

// ─── CONTROLS ──────────────────────────────────────────────────────────────
document.getElementById('micBtn').onclick = () => {
  micMuted = !micMuted;
  localStream.getAudioTracks().forEach(t => t.enabled = !micMuted);
  const btn = document.getElementById('micBtn');
  btn.className = 'ctrl-btn ' + (micMuted ? 'muted' : 'off');
  document.getElementById('micSvg').innerHTML = micMuted
    ? '<path d="M19 11h-1.7c0 .74-.16 1.43-.43 2.05l1.23 1.23c.56-.98.9-2.09.9-3.28zm-4.02.17c0-.06.02-.11.02-.17V5c0-1.66-1.34-3-3-3S9 3.34 9 5v.18l5.98 5.99zM4.27 3L3 4.27l6.01 6.01V11c0 1.66 1.33 3 2.99 3 .22 0 .44-.03.65-.08l1.66 1.66c-.71.33-1.5.52-2.31.52-2.76 0-5.3-2.1-5.3-5.1H5c0 3.41 2.72 6.23 6 6.72V21h2v-3.28c.91-.13 1.77-.45 2.54-.9L19.73 21 21 19.73 4.27 3z"/>'
    : '<path d="M12 14c1.66 0 3-1.34 3-3V5c0-1.66-1.34-3-3-3S9 3.34 9 5v6c0 1.66 1.34 3 3 3zm5.91-3c-.49 0-.9.36-.98.85C16.52 14.2 14.47 16 12 16s-4.52-1.8-4.93-4.15-.49-.85-.98-.85c-.61 0-1.09.54-1 1.14.49 3 2.89 5.35 5.91 5.78V21c0 .55.45 1 1 1s1-.45 1-1v-2.08c3.02-.43 5.42-2.78 5.91-5.78.09-.6-.4-1.14-1.01-1.14z"/>';
  document.getElementById('micTip').textContent = micMuted ? 'Включить микрофон' : 'Выключить микрофон';
  updateSidebar();
};

document.getElementById('camBtn').onclick = () => {
  camOff = !camOff;
  localStream.getVideoTracks().forEach(t => t.enabled = !camOff);
  const btn = document.getElementById('camBtn');
  btn.className = 'ctrl-btn ' + (camOff ? 'muted' : 'off');
  document.getElementById('camSvg').innerHTML = camOff
    ? '<path d="M18 10.48V6c0-1.1-.9-2-2-2H4c-1.1 0-2 .9-2 2v12c0 1.1.9 2 2 2h12c1.1 0 2-.9 2-2v-4.48l4 3.98v-11l-4 3.5zm-2-.79V18H4V6h12v3.69zM21.42 3L3 21.42l1.41 1.41L22.83 4.41z"/>'
    : '<path d="M17 10.5V7c0-.55-.45-1-1-1H4c-.55 0-1 .45-1 1v10c0 .55.45 1 1 1h12c.55 0 1-.45 1-1v-3.5l4 4v-11l-4 4z"/>';
  document.getElementById('camTip').textContent = camOff ? 'Включить камеру' : 'Выключить камеру';
  refreshVideoOverlay('local', localStream);
};

document.getElementById('screenBtn').onclick = async () => {
  if (screenSharing) {
    screenStream.getTracks().forEach(t => t.stop());
    screenStream = null;
    screenSharing = false;
    document.getElementById('screenBtn').className = 'ctrl-btn off';
    // restore video track
    const vt = localStream.getVideoTracks()[0];
    if (vt) {
      for (const p of Object.values(peers)) {
        const sender = p.call?.peerConnection?.getSenders?.().find(s => s.track?.kind==='video');
        if (sender) sender.replaceTrack(vt).catch(()=>{});
      }
    }
    const lv = document.querySelector('#tile-local video');
    if (lv) lv.srcObject = localStream;
  } else {
    try {
      screenStream = await navigator.mediaDevices.getDisplayMedia({video:true, audio:true});
      screenSharing = true;
      document.getElementById('screenBtn').className = 'ctrl-btn active';
      const st = screenStream.getVideoTracks()[0];
      for (const p of Object.values(peers)) {
        const sender = p.call?.peerConnection?.getSenders?.().find(s => s.track?.kind==='video');
        if (sender) sender.replaceTrack(st).catch(()=>{});
      }
      const lv = document.querySelector('#tile-local video');
      if (lv) lv.srcObject = screenStream;
      st.onended = () => document.getElementById('screenBtn').click();
    } catch(e) {}
  }
};

document.getElementById('leaveBtn').onclick = () => {
  myPeer?.destroy();
  for (const p of Object.values(peers)) { try { p.call?.close(); } catch(e) {} }
  localStream?.getTracks().forEach(t => t.stop());
  location.reload();
};
</script>
