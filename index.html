<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>VoiceRoom</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap');
*{margin:0;padding:0;box-sizing:border-box}
:root{
  --bg:#0D0E14;--surface:#16181F;--card:#1E2029;--border:#2A2D3A;
  --accent:#5865F2;--accent-h:#4752C4;--accent-dim:rgba(88,101,242,.15);
  --green:#23A55A;--green-dim:rgba(35,165,90,.15);
  --red:#F23F43;--red-dim:rgba(242,63,67,.15);
  --yellow:#FEE75C;
  --text:#E3E5E8;--muted:#949BA4;--dim:#5C6068;--r:12px;
}
body{background:var(--bg);color:var(--text);font-family:'Inter',-apple-system,sans-serif;min-height:100vh;display:flex;flex-direction:column}

/* HEADER */
header{padding:14px 24px;border-bottom:1px solid var(--border);display:flex;align-items:center;gap:12px;background:var(--surface);flex-shrink:0}
.logo{width:32px;height:32px;background:var(--accent);border-radius:8px;display:flex;align-items:center;justify-content:center;flex-shrink:0}
.logo svg{width:18px;height:18px;fill:#fff}
h1{font-size:16px;font-weight:600}
.hright{margin-left:auto;display:flex;align-items:center;gap:10px}
.link-box{display:flex;align-items:center;gap:6px;background:var(--card);border:1px solid var(--border);border-radius:8px;padding:5px 10px;font-size:12px;color:var(--muted);cursor:pointer;transition:border-color .15s;max-width:320px}
.link-box:hover{border-color:var(--accent);color:var(--text)}
.link-box svg{width:13px;height:13px;fill:currentColor;flex-shrink:0}
.link-text{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.toast{font-size:11px;color:var(--green);opacity:0;transition:opacity .2s;white-space:nowrap}
.toast.show{opacity:1}

main{flex:1;display:flex;overflow:hidden;min-height:0}

/* SIDEBAR */
.sidebar{width:220px;background:var(--surface);border-right:1px solid var(--border);display:flex;flex-direction:column;padding:16px 0 0;flex-shrink:0;overflow-y:auto}
.ch-label{font-size:11px;font-weight:600;color:var(--dim);text-transform:uppercase;letter-spacing:.8px;padding:0 16px;margin-bottom:6px}
.channel{display:flex;align-items:center;gap:8px;padding:7px 12px;margin:0 8px 12px;border-radius:6px;background:var(--accent-dim);color:var(--accent);font-size:14px}
.channel svg{width:15px;height:15px;fill:currentColor;flex-shrink:0}
.participant{display:flex;align-items:center;gap:8px;padding:5px 12px;font-size:13px;color:var(--muted);border-radius:6px;margin:0 4px}
.participant:hover{background:var(--card)}
.av{width:28px;height:28px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:600;flex-shrink:0;transition:box-shadow .2s}
.av.sp{box-shadow:0 0 0 2px var(--green)}
.pname{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.mic-ic{width:14px;height:14px;flex-shrink:0;display:flex;align-items:center}
.mic-ic svg{width:14px;height:14px}

/* CONTENT */
.content{flex:1;display:flex;flex-direction:column;overflow:hidden;min-height:0}
.statusbar{display:flex;align-items:center;gap:8px;padding:7px 20px;font-size:12px;font-weight:500;flex-shrink:0}
.statusbar.ok{background:var(--green-dim);border-bottom:1px solid rgba(35,165,90,.2);color:var(--green)}
.statusbar.connecting{background:rgba(254,231,92,.08);border-bottom:1px solid rgba(254,231,92,.2);color:var(--yellow)}
.statusbar.err{background:var(--red-dim);border-bottom:1px solid rgba(242,63,67,.2);color:var(--red)}
.sdot{width:7px;height:7px;border-radius:50%;background:currentColor;animation:pulse 2s infinite;flex-shrink:0}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.4}}

/* VIDEO GRID */
.vgrid{flex:1;padding:20px;display:grid;gap:12px;overflow-y:auto;align-content:start;grid-template-columns:repeat(auto-fill,minmax(260px,1fr))}
.vtile{background:var(--card);border-radius:var(--r);border:2px solid var(--border);aspect-ratio:16/9;position:relative;overflow:hidden;transition:border-color .2s}
.vtile.sp{border-color:var(--green)}
.vtile video{width:100%;height:100%;object-fit:cover;display:block}
.novid{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;background:var(--card)}
.bav{width:68px;height:68px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:24px;font-weight:600;transition:box-shadow .2s}
.bav.sp{box-shadow:0 0 0 3px var(--green)}
.wbars{display:flex;align-items:center;gap:3px;height:20px;opacity:0;transition:opacity .2s}
.wbars.on{opacity:1}
.bar{width:3px;border-radius:2px;background:var(--green);animation:wave .8s ease-in-out infinite}
.bar:nth-child(2){animation-delay:.1s}.bar:nth-child(3){animation-delay:.2s}.bar:nth-child(4){animation-delay:.1s}
@keyframes wave{0%,100%{height:4px}50%{height:18px}}
.tlabel{position:absolute;bottom:10px;left:10px;background:rgba(0,0,0,.65);color:#fff;font-size:12px;font-weight:500;padding:3px 8px;border-radius:4px;backdrop-filter:blur(4px);display:flex;align-items:center;gap:5px}
.tlabel svg{width:11px;height:11px;fill:var(--red);flex-shrink:0}
.empty{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;color:var(--dim);grid-column:1/-1;min-height:220px;text-align:center}
.empty svg{width:44px;height:44px;fill:var(--dim);opacity:.4}
.empty p{font-size:14px;line-height:1.6}

/* CONTROLS */
.cbar{padding:14px 24px;background:var(--surface);border-top:1px solid var(--border);display:flex;align-items:center;justify-content:center;gap:10px;flex-shrink:0}
.cb{width:46px;height:46px;border-radius:12px;border:none;cursor:pointer;display:flex;align-items:center;justify-content:center;transition:background .15s,transform .1s;position:relative}
.cb:active{transform:scale(.95)}
.cb svg{width:20px;height:20px;pointer-events:none}
.cb.off{background:var(--card);border:1px solid var(--border)}
.cb.off svg{fill:var(--text)}
.cb.off:hover{background:#262835}
.cb.mut{background:var(--red-dim);border:1px solid rgba(242,63,67,.3)}
.cb.mut svg{fill:var(--red)}
.cb.mut:hover{background:rgba(242,63,67,.25)}
.cb.act{background:var(--accent-dim);border:1px solid rgba(88,101,242,.3)}
.cb.act svg{fill:var(--accent)}
.cb.danger{background:var(--red);border:none}
.cb.danger svg{fill:#fff}
.cb.danger:hover{background:#D63538}
.tip{position:absolute;bottom:52px;left:50%;transform:translateX(-50%);background:#111;color:#fff;font-size:11px;padding:4px 8px;border-radius:4px;white-space:nowrap;pointer-events:none;opacity:0;transition:opacity .15s;z-index:10}
.cb:hover .tip{opacity:1}

/* JOIN OVERLAY */
.joverlay{position:fixed;inset:0;background:rgba(13,14,20,.97);display:flex;align-items:center;justify-content:center;z-index:100;backdrop-filter:blur(8px)}
.jcard{background:var(--card);border:1px solid var(--border);border-radius:20px;padding:36px 40px;width:420px;display:flex;flex-direction:column;align-items:center}
.jlogo{width:52px;height:52px;background:var(--accent);border-radius:14px;display:flex;align-items:center;justify-content:center;margin-bottom:18px}
.jlogo svg{width:28px;height:28px;fill:#fff}
.jcard h2{font-size:21px;font-weight:600;margin-bottom:8px}
.jcard .sub{color:var(--muted);font-size:13px;text-align:center;margin-bottom:22px;line-height:1.6}
.pvbox{width:100%;aspect-ratio:16/9;background:#0a0b10;border-radius:10px;border:1px solid var(--border);margin-bottom:18px;overflow:hidden;position:relative}
.pvbox video{width:100%;height:100%;object-fit:cover}
.pv-none{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px;color:var(--muted);font-size:13px}
.pv-none svg{width:32px;height:32px;fill:var(--dim)}
.ninput{width:100%;background:var(--surface);border:1px solid var(--border);border-radius:8px;color:var(--text);font-size:14px;padding:10px 14px;margin-bottom:12px;outline:none;transition:border-color .15s;font-family:inherit}
.ninput:focus{border-color:var(--accent)}
.drow{display:flex;gap:8px;width:100%;margin-bottom:18px}
.dsel{flex:1;background:var(--surface);border:1px solid var(--border);border-radius:8px;color:var(--text);font-size:12px;padding:8px 10px;outline:none;cursor:pointer;font-family:inherit;transition:border-color .15s}
.dsel:focus{border-color:var(--accent)}
.jbtn{width:100%;background:var(--accent);color:#fff;border:none;border-radius:10px;padding:13px;font-size:15px;font-weight:600;cursor:pointer;transition:background .15s,transform .1s;font-family:inherit}
.jbtn:hover{background:var(--accent-h)}
.jbtn:active{transform:scale(.99)}
.jbtn:disabled{opacity:.5;cursor:not-allowed}

@media(max-width:600px){.sidebar{display:none}.jcard{width:92vw;padding:28px 20px}.vgrid{grid-template-columns:1fr}}
</style>
</head>
<body>

<!-- JOIN OVERLAY -->
<div class="joverlay" id="JO">
  <div class="jcard">
    <div class="jlogo"><svg viewBox="0 0 24 24"><path d="M12 3a9 9 0 100 18A9 9 0 0012 3zm-1 13H9V8h2v8zm4 0h-2V8h2v8z"/></svg></div>
    <h2>Войти в комнату</h2>
    <p class="sub">Голосовой и видеочат прямо в браузере.<br>Поделись ссылкой — друг подключится мгновенно.</p>
    <div class="pvbox">
      <video id="pvVid" autoplay muted playsinline></video>
      <div class="pv-none" id="pvNone">
        <svg viewBox="0 0 24 24"><path d="M18 10.48V6c0-1.1-.9-2-2-2H4c-1.1 0-2 .9-2 2v12c0 1.1.9 2 2 2h12c1.1 0 2-.9 2-2v-4.48l4 3.98v-11l-4 3.5zm-2-.79V18H4V6h12v3.69z"/></svg>
        <span>Камера недоступна</span>
      </div>
    </div>
    <input class="ninput" id="nameIn" type="text" placeholder="Ваше имя" maxlength="24" autocomplete="off">
    <div class="drow">
      <select class="dsel" id="micSel"><option>🎤 Микрофон...</option></select>
      <select class="dsel" id="camSel"><option>📷 Камера...</option></select>
    </div>
    <button class="jbtn" id="joinBtn">Подключиться</button>
  </div>
</div>

<!-- HEADER -->
<header>
  <div class="logo"><svg viewBox="0 0 24 24"><path d="M12 3a9 9 0 100 18A9 9 0 0012 3zm-1 13H9V8h2v8zm4 0h-2V8h2v8z"/></svg></div>
  <h1>VoiceRoom</h1>
  <div class="hright">
    <div class="link-box" id="copyBtn">
      <svg viewBox="0 0 24 24"><path d="M16 1H4c-1.1 0-2 .9-2 2v14h2V3h12V1zm3 4H8c-1.1 0-2 .9-2 2v14c0 1.1.9 2 2 2h11c1.1 0 2-.9 2-2V7c0-1.1-.9-2-2-2zm0 16H8V7h11v14z"/></svg>
      <span class="link-text" id="hdrUrl">—</span>
    </div>
    <span class="toast" id="toast">✓ Скопировано</span>
  </div>
</header>

<main>
  <div class="sidebar">
    <div style="padding:0 12px;margin-bottom:12px">
      <div class="ch-label" style="margin-bottom:6px">Голосовые</div>
      <div class="channel">
        <svg viewBox="0 0 24 24"><path d="M12 14c1.66 0 3-1.34 3-3V5c0-1.66-1.34-3-3-3S9 3.34 9 5v6c0 1.66 1.34 3 3 3zm5.91-3c-.49 0-.9.36-.98.85C16.52 14.2 14.47 16 12 16s-4.52-1.8-4.93-4.15A1 1 0 009.1 12c-.61 0-1.09.54-1 1.14.49 3 2.89 5.35 5.91 5.78V21c0 .55.45 1 1 1s1-.45 1-1v-2.08c3.02-.43 5.42-2.78 5.91-5.78.09-.6-.4-1.14-1.01-1.14z"/></svg>
        Общий
      </div>
    </div>
    <div class="ch-label">Участники</div>
    <div id="sideList"></div>
  </div>

  <div class="content">
    <div class="statusbar connecting" id="sbar" style="display:none">
      <div class="sdot"></div>
      <span id="stxt">Подключение...</span>
    </div>
    <div class="vgrid" id="grid">
      <div class="empty" id="emptyHint">
        <svg viewBox="0 0 24 24"><path d="M16 11c1.66 0 2.99-1.34 2.99-3S17.66 5 16 5c-1.66 0-3 1.34-3 3s1.34 3 3 3zm-8 0c1.66 0 2.99-1.34 2.99-3S9.66 5 8 5C6.34 5 5 6.34 5 8s1.34 3 3 3zm0 2c-2.33 0-7 1.17-7 3.5V19h14v-2.5c0-2.33-4.67-3.5-7-3.5zm8 0c-.29 0-.62.02-.97.05 1.16.84 1.97 1.97 1.97 3.45V19h6v-2.5c0-2.33-4.67-3.5-7-3.5z"/></svg>
        <p>Войдите и поделитесь ссылкой с другом</p>
      </div>
    </div>
    <div class="cbar">
      <button class="cb off" id="micBtn">
        <svg id="micI" viewBox="0 0 24 24"><path d="M12 14c1.66 0 3-1.34 3-3V5c0-1.66-1.34-3-3-3S9 3.34 9 5v6c0 1.66 1.34 3 3 3zm5.91-3c-.49 0-.9.36-.98.85C16.52 14.2 14.47 16 12 16s-4.52-1.8-4.93-4.15A1 1 0 009.1 12c-.61 0-1.09.54-1 1.14.49 3 2.89 5.35 5.91 5.78V21c0 .55.45 1 1 1s1-.45 1-1v-2.08c3.02-.43 5.42-2.78 5.91-5.78.09-.6-.4-1.14-1.01-1.14z"/></svg>
        <span class="tip" id="micTip">Выкл. микрофон</span>
      </button>
      <button class="cb off" id="camBtn">
        <svg id="camI" viewBox="0 0 24 24"><path d="M17 10.5V7c0-.55-.45-1-1-1H4c-.55 0-1 .45-1 1v10c0 .55.45 1 1 1h12c.55 0 1-.45 1-1v-3.5l4 4v-11l-4 4z"/></svg>
        <span class="tip" id="camTip">Выкл. камеру</span>
      </button>
      <button class="cb off" id="scrBtn">
        <svg viewBox="0 0 24 24"><path d="M21 3H3c-1.11 0-2 .89-2 2v12c0 1.1.89 2 2 2h5v2h8v-2h5c1.1 0 1.99-.9 1.99-2L23 5c0-1.11-.9-2-2-2zm0 14H3V5h18v12z"/></svg>
        <span class="tip">Демонстрация экрана</span>
      </button>
      <button class="cb danger" id="lvBtn">
        <svg viewBox="0 0 24 24"><path d="M10.09 15.59L11.5 17l5-5-5-5-1.41 1.41L12.67 11H3v2h9.67l-2.58 2.59zM19 3H5c-1.11 0-2 .9-2 2v4h2V5h14v14H5v-4H3v4c0 1.1.89 2 2 2h14c1.1 0 2-.9 2-2V5c0-1.1-.9-2-2-2z"/></svg>
        <span class="tip">Покинуть</span>
      </button>
    </div>
  </div>
</main>

<script>
// ── helpers ──────────────────────────────────────────────
const COLORS=['#5865F2','#57F287','#FEE75C','#EB459E','#ED4245','#7289DA','#00B4D8'];
const pickCol=n=>COLORS[Math.abs([...n].reduce((s,c)=>s+c.charCodeAt(0),0))%COLORS.length];
const inits=n=>n.trim().split(/\s+/).map(w=>w[0]).join('').toUpperCase().slice(0,2)||'?';

// ── room from URL hash ────────────────────────────────────
const ROOM=(()=>{let h=location.hash.slice(1);if(!h){h='R'+Math.random().toString(36).slice(2,7).toUpperCase();location.hash=h;}return h;})();
const myId='u'+Math.random().toString(36).slice(2,10);
const ROOM_URL=location.href.split('#')[0]+'#'+ROOM;

document.getElementById('hdrUrl').textContent=ROOM_URL;
document.getElementById('copyBtn').onclick=()=>{
  navigator.clipboard.writeText(ROOM_URL).then(()=>{
    const t=document.getElementById('toast');t.classList.add('show');setTimeout(()=>t.classList.remove('show'),2000);
  });
};

// ── state ─────────────────────────────────────────────────
let localStream=null,localName='';
let micMuted=false,camOff=false,screenSharing=false,screenStream=null;
const peers={}; // id->{pc,name,stream,micMuted,speaking,dc}
let ws=null;

const ICE={iceServers:[
  {urls:'stun:stun.relay.metered.ca:80'},
  {urls:'turn:global.relay.metered.ca:80',username:'22dcdb3ea099960131a0f099',credential:'g0BEaRysz1LsheIY'},
  {urls:'turn:global.relay.metered.ca:80?transport=tcp',username:'22dcdb3ea099960131a0f099',credential:'g0BEaRysz1LsheIY'},
  {urls:'turn:global.relay.metered.ca:443',username:'22dcdb3ea099960131a0f099',credential:'g0BEaRysz1LsheIY'},
  {urls:'turns:global.relay.metered.ca:443?transport=tcp',username:'22dcdb3ea099960131a0f099',credential:'g0BEaRysz1LsheIY'},
]};

// ── devices ───────────────────────────────────────────────
async function loadDevices(){
  try{const tmp=await navigator.mediaDevices.getUserMedia({audio:true,video:true});tmp.getTracks().forEach(t=>t.stop());}catch{}
  try{
    const devs=await navigator.mediaDevices.enumerateDevices();
    const mics=devs.filter(d=>d.kind==='audioinput');
    const cams=devs.filter(d=>d.kind==='videoinput');
    document.getElementById('micSel').innerHTML=mics.map((d,i)=>`<option value="${d.deviceId}">${d.label||'Микрофон '+(i+1)}</option>`).join('');
    document.getElementById('camSel').innerHTML=cams.map((d,i)=>`<option value="${d.deviceId}">${d.label||'Камера '+(i+1)}</option>`).join('');
  }catch{}
}
async function startPreview(){
  try{const s=await navigator.mediaDevices.getUserMedia({video:true,audio:false});document.getElementById('pvVid').srcObject=s;document.getElementById('pvNone').style.display='none';}catch{}
}
loadDevices();startPreview();

// ── join ──────────────────────────────────────────────────
document.getElementById('joinBtn').onclick=doJoin;
document.getElementById('nameIn').onkeydown=e=>{if(e.key==='Enter')doJoin();};

async function doJoin(){
  const name=document.getElementById('nameIn').value.trim()||'Гость';
  localName=name;
  const btn=document.getElementById('joinBtn');
  btn.disabled=true;btn.textContent='Получаем доступ...';
  const micId=document.getElementById('micSel').value;
  const camId=document.getElementById('camSel').value;
  try{
    localStream=await navigator.mediaDevices.getUserMedia({
      audio:micId?{deviceId:{exact:micId}}:true,
      video:camId?{deviceId:{exact:camId}}:true
    });
  }catch(e){
    try{localStream=await navigator.mediaDevices.getUserMedia({audio:true});}
    catch{localStream=new MediaStream();}
  }
  const pv=document.getElementById('pvVid');
  if(pv.srcObject){pv.srcObject.getTracks().forEach(t=>t.stop());pv.srcObject=null;}
  document.getElementById('JO').style.display='none';
  showBar('connecting','Подключение...');
  renderLocalTile();
  setupVAD();
  connectWS(name);
}

// ── WebSocket signaling ───────────────────────────────────
function connectWS(name){
  const proto=location.protocol==='https:'?'wss':'ws';
  const url=`${proto}://${location.host}/ws?room=${encodeURIComponent(ROOM)}&name=${encodeURIComponent(name)}&id=${myId}`;
  ws=new WebSocket(url);

  ws.onopen=()=>{
    showBar('ok',`Подключено · 1 участник`);
  };

  ws.onmessage=async e=>{
    let msg;try{msg=JSON.parse(e.data);}catch{return;}
    await handleMsg(msg);
  };

  ws.onerror=()=>showBar('err','Нет соединения — убедись что server.js запущен');
  ws.onclose=()=>{
    showBar('connecting','Переподключение...');
    setTimeout(()=>connectWS(name),2000);
  };
}

function wsSend(obj){
  if(ws&&ws.readyState===1)ws.send(JSON.stringify(obj));
}

async function handleMsg(msg){
  const{type,from,name:pname,sdp,candidate,peers:peerList,myId:serverId}=msg;

  if(type==='room-info'){
    // Connect to everyone already in the room
    for(const p of(peerList||[])){
      if(p.id!==myId&&!peers[p.id]) await callPeer(p.id,p.name);
    }
    updateCount();
  }
  else if(type==='user-joined'){
    updateCount();
    // They will call us; just wait
  }
  else if(type==='offer'){
    if(!peers[from]) await answerPeer(from,pname,sdp);
  }
  else if(type==='answer'){
    if(peers[from]) await peers[from].pc.setRemoteDescription(new RTCSessionDescription(sdp));
  }
  else if(type==='ice'){
    if(peers[from]&&candidate) peers[from].pc.addIceCandidate(new RTCIceCandidate(candidate)).catch(()=>{});
  }
  else if(type==='user-left'){
    removePeer(from);
  }
  else if(type==='meta'){
    if(peers[from]){
      peers[from].micMuted=msg.micMuted;
      peers[from].speaking=msg.speaking;
      setSp(from,msg.speaking);
      updateSidebar();
    }
  }
}

// ── WebRTC ─────────────────────────────────────────────────
function makePC(peerId,peerName){
  const pc=new RTCPeerConnection(ICE);
  peers[peerId]={pc,name:peerName,stream:null,micMuted:false,speaking:false};
  localStream.getTracks().forEach(t=>pc.addTrack(t,localStream));
  ensureTile(peerId,peerName);
  setConnState(peerId,'connecting');

  const remoteStream=new MediaStream();
  pc.ontrack=e=>{
    console.log('[ontrack]',peerId,e.track.kind);
    remoteStream.addTrack(e.track);
    peers[peerId].stream=remoteStream;
    renderPeerTile(peerId,peerName,remoteStream);
    updateSidebar();updateCount();
  };

  pc.onicecandidate=e=>{
    if(e.candidate) wsSend({type:'ice',to:peerId,from:myId,candidate:e.candidate});
  };

  pc.oniceconnectionstatechange=()=>{
    console.log('[ICE state]',peerId,pc.iceConnectionState);
    setConnState(peerId,pc.iceConnectionState);
  };

  pc.onconnectionstatechange=()=>{
    console.log('[PC state]',peerId,pc.connectionState);
    setConnState(peerId,pc.connectionState);
    if(pc.connectionState==='failed'||pc.connectionState==='disconnected') removePeer(peerId);
  };

  // Data channel for mute/speaking state
  try{
    const dc=pc.createDataChannel('meta',{ordered:false,maxRetransmits:0});
    dc.onmessage=e=>applyMeta(peerId,e.data);
    peers[peerId].dc=dc;
    pc.ondatachannel=ev=>{ev.channel.onmessage=e=>applyMeta(peerId,e.data);};
  }catch{}

  return pc;
}

function applyMeta(peerId,raw){
  try{
    const d=JSON.parse(raw);
    if(!peers[peerId]) return;
    peers[peerId].micMuted=d.micMuted;
    peers[peerId].speaking=d.speaking;
    setSp(peerId,d.speaking);
    updateSidebar();
    updateLabelMute(peerId,d.micMuted);
  }catch{}
}

async function callPeer(peerId,peerName){
  const pc=makePC(peerId,peerName);
  const offer=await pc.createOffer();
  await pc.setLocalDescription(offer);
  wsSend({type:'offer',to:peerId,from:myId,name:localName,sdp:offer});
}

async function answerPeer(peerId,peerName,sdp){
  const pc=makePC(peerId,peerName);
  await pc.setRemoteDescription(new RTCSessionDescription(sdp));
  const answer=await pc.createAnswer();
  await pc.setLocalDescription(answer);
  wsSend({type:'answer',to:peerId,from:myId,name:localName,sdp:answer});
}

function removePeer(peerId){
  if(!peers[peerId]) return;
  try{peers[peerId].pc.close();}catch{}
  delete peers[peerId];
  document.getElementById('tile-'+peerId)?.remove();
  updateSidebar();updateCount();
}

function countP(){return 1+Object.keys(peers).length;}
function updateCount(){showBar('ok',`Подключено · ${countP()} участник${countP()===1?'':'ов'}`);}

// ── VAD ───────────────────────────────────────────────────
function setupVAD(){
  try{
    const ctx=new(window.AudioContext||window.webkitAudioContext)();
    const an=ctx.createAnalyser();an.fftSize=512;
    ctx.createMediaStreamSource(localStream).connect(an);
    const data=new Uint8Array(an.frequencyBinCount);
    let wasSp=false;
    setInterval(()=>{
      an.getByteFrequencyData(data);
      const vol=data.reduce((a,b)=>a+b,0)/data.length;
      const sp=vol>12&&!micMuted;
      if(sp!==wasSp){wasSp=sp;setSp('local',sp);broadcastMeta(sp);}
    },120);
  }catch{}
}

function broadcastMeta(speaking=false){
  const d=JSON.stringify({micMuted,speaking});
  // via data channels
  for(const p of Object.values(peers)){
    try{if(p.dc&&p.dc.readyState==='open')p.dc.send(d);}catch{}
  }
  // also via signaling server as fallback
  wsSend({type:'meta',from:myId,room:ROOM,micMuted,speaking});
}

// ── tiles ──────────────────────────────────────────────────
function renderLocalTile(){
  document.getElementById('emptyHint')?.remove();
  document.getElementById('grid').appendChild(makeTile('local',localName,localStream,true));
  updateSidebar();
}
function renderPeerTile(id,name,stream){
  if(!document.getElementById('tile-'+id)){
    document.getElementById('grid').appendChild(makeTile(id,name,stream,false));
  }else{
    const v=document.querySelector('#tile-'+id+' video');
    if(v)v.srcObject=stream;
    refreshOv(id,stream);
  }
}
function makeTile(id,name,stream,local){
  const tile=document.createElement('div');
  tile.className='vtile';tile.id='tile-'+id;
  const v=document.createElement('video');
  v.autoplay=true;v.playsInline=true;if(local)v.muted=true;
  v.srcObject=stream;tile.appendChild(v);
  // Некоторые браузеры блокируют автовоспроизведение звука без явного клика —
  // пытаемся запустить воспроизведение и, если не получилось, ждём любой клик на странице
  const tryPlay=()=>v.play().catch(()=>{
    const retry=()=>{v.play().catch(()=>{});document.removeEventListener('click',retry);};
    document.addEventListener('click',retry,{once:true});
  });
  tryPlay();
  const ov=document.createElement('div');ov.className='novid';ov.id='ov-'+id;
  const col=pickCol(name);
  const av=document.createElement('div');av.className='bav';av.id='bav-'+id;
  av.style.background=col+'33';av.style.color=col;av.textContent=inits(name);
  const bars=document.createElement('div');bars.className='wbars';bars.id='bars-'+id;
  for(let i=0;i<4;i++){const b=document.createElement('div');b.className='bar';bars.appendChild(b);}
  ov.appendChild(av);ov.appendChild(bars);tile.appendChild(ov);
  const lbl=document.createElement('div');lbl.className='tlabel';lbl.id='lbl-'+id;
  lbl.innerHTML=`<span>${local?'Вы ('+name+')':name}</span>`;
  tile.appendChild(lbl);
  const stat=document.createElement('div');stat.id='stat-'+id;
  stat.style.cssText='position:absolute;top:8px;right:8px;background:rgba(0,0,0,.7);color:#FEE75C;font-size:10px;font-weight:600;padding:3px 7px;border-radius:5px;display:none;z-index:5';
  tile.appendChild(stat);
  refreshOv(id,stream);
  return tile;
}
function refreshOv(id,stream){
  const ov=document.getElementById('ov-'+id);
  const v=document.querySelector('#tile-'+id+' video');
  if(!ov||!v)return;
  const hasV=stream&&stream.getVideoTracks().some(t=>t.enabled&&t.readyState==='live');
  ov.style.display=hasV?'none':'flex';
}
function setConnState(id,state){
  const el=document.getElementById('stat-'+id);
  if(!el)return;
  el.textContent=state;
  el.style.display=(state==='connected'||state==='completed')?'none':'block';
}
function ensureTile(id,name){
  if(document.getElementById('tile-'+id)) return;
  document.getElementById('emptyHint')?.remove();
  document.getElementById('grid').appendChild(makeTile(id,name,new MediaStream(),false));
}
function setSp(id,sp){
  document.getElementById('tile-'+id)?.classList.toggle('sp',sp);
  document.getElementById('bars-'+id)?.classList.toggle('on',sp);
  document.getElementById('bav-'+id)?.classList.toggle('sp',sp);
  const sav=document.querySelector('#side-'+id+' .av');
  if(sav)sav.classList.toggle('sp',sp);
}
function updateLabelMute(id,muted){
  const lbl=document.getElementById('lbl-'+id);
  if(!lbl)return;
  const existing=lbl.querySelector('svg');
  if(muted&&!existing){
    const s=document.createElementNS('http://www.w3.org/2000/svg','svg');
    s.setAttribute('viewBox','0 0 24 24');s.style.cssText='width:11px;height:11px;fill:var(--red);flex-shrink:0';
    s.innerHTML='<path d="M19 11h-1.7c0 .74-.16 1.43-.43 2.05l1.23 1.23c.56-.98.9-2.09.9-3.28zm-4.02.17V5c0-1.66-1.34-3-3-3S9 3.34 9 5v.18l5.98 5.99zM4.27 3L3 4.27l6.01 6.01V11c0 1.66 1.33 3 2.99 3l1.66 1.66c-.71.33-1.5.52-2.31.52-2.76 0-5.3-2.1-5.3-5.1H5c0 3.41 2.72 6.23 6 6.72V21h2v-3.28c.91-.13 1.77-.45 2.54-.9L19.73 21 21 19.73 4.27 3z"/>';
    lbl.insertBefore(s,lbl.firstChild);
  }else if(!muted&&existing){existing.remove();}
}
function showBar(type,text){
  const b=document.getElementById('sbar');
  b.style.display='flex';b.className='statusbar '+type;
  document.getElementById('stxt').textContent=text;
}

// ── sidebar ────────────────────────────────────────────────
function updateSidebar(){
  const c=document.getElementById('sideList');c.innerHTML='';
  const all=[{id:'local',name:'Вы ('+localName+')',micMuted,speaking:false}];
  for(const[id,p] of Object.entries(peers))all.push({id,name:p.name,micMuted:p.micMuted,speaking:p.speaking});
  for(const p of all){
    const col=pickCol(p.name);
    const d=document.createElement('div');d.className='participant';d.id='side-'+p.id;
    d.innerHTML=`
      <div class="av${p.speaking?' sp':''}" style="background:${col}33;color:${col}">${inits(p.name)}</div>
      <span class="pname">${p.name}</span>
      <div class="mic-ic"><svg viewBox="0 0 24 24" fill="${p.micMuted?'var(--red)':'var(--dim)'}">
        ${p.micMuted
          ?'<path d="M19 11h-1.7c0 .74-.16 1.43-.43 2.05l1.23 1.23c.56-.98.9-2.09.9-3.28zm-4.02.17V5c0-1.66-1.34-3-3-3S9 3.34 9 5v.18l5.98 5.99zM4.27 3L3 4.27l6.01 6.01V11c0 1.66 1.33 3 2.99 3l1.66 1.66c-.71.33-1.5.52-2.31.52-2.76 0-5.3-2.1-5.3-5.1H5c0 3.41 2.72 6.23 6 6.72V21h2v-3.28c.91-.13 1.77-.45 2.54-.9L19.73 21 21 19.73 4.27 3z"/>'
          :'<path d="M12 14c1.66 0 3-1.34 3-3V5c0-1.66-1.34-3-3-3S9 3.34 9 5v6c0 1.66 1.34 3 3 3zm5.91-3c-.49 0-.9.36-.98.85C16.52 14.2 14.47 16 12 16s-4.52-1.8-4.93-4.15A1 1 0 009.1 12c-.61 0-1.09.54-1 1.14.49 3 2.89 5.35 5.91 5.78V21c0 .55.45 1 1 1s1-.45 1-1v-2.08c3.02-.43 5.42-2.78 5.91-5.78.09-.6-.4-1.14-1.01-1.14z"/>'}
      </svg></div>`;
    c.appendChild(d);
  }
}

// ── controls ───────────────────────────────────────────────
document.getElementById('micBtn').onclick=()=>{
  micMuted=!micMuted;
  localStream.getAudioTracks().forEach(t=>t.enabled=!micMuted);
  document.getElementById('micBtn').className='cb '+(micMuted?'mut':'off');
  document.getElementById('micI').innerHTML=micMuted
    ?'<path d="M19 11h-1.7c0 .74-.16 1.43-.43 2.05l1.23 1.23c.56-.98.9-2.09.9-3.28zm-4.02.17V5c0-1.66-1.34-3-3-3S9 3.34 9 5v.18l5.98 5.99zM4.27 3L3 4.27l6.01 6.01V11c0 1.66 1.33 3 2.99 3l1.66 1.66c-.71.33-1.5.52-2.31.52-2.76 0-5.3-2.1-5.3-5.1H5c0 3.41 2.72 6.23 6 6.72V21h2v-3.28c.91-.13 1.77-.45 2.54-.9L19.73 21 21 19.73 4.27 3z"/>'
    :'<path d="M12 14c1.66 0 3-1.34 3-3V5c0-1.66-1.34-3-3-3S9 3.34 9 5v6c0 1.66 1.34 3 3 3zm5.91-3c-.49 0-.9.36-.98.85C16.52 14.2 14.47 16 12 16s-4.52-1.8-4.93-4.15A1 1 0 009.1 12c-.61 0-1.09.54-1 1.14.49 3 2.89 5.35 5.91 5.78V21c0 .55.45 1 1 1s1-.45 1-1v-2.08c3.02-.43 5.42-2.78 5.91-5.78.09-.6-.4-1.14-1.01-1.14z"/>';
  document.getElementById('micTip').textContent=micMuted?'Вкл. микрофон':'Выкл. микрофон';
  updateSidebar();broadcastMeta(false);
};

document.getElementById('camBtn').onclick=()=>{
  camOff=!camOff;
  localStream.getVideoTracks().forEach(t=>t.enabled=!camOff);
  document.getElementById('camBtn').className='cb '+(camOff?'mut':'off');
  document.getElementById('camI').innerHTML=camOff
    ?'<path d="M21 6.5l-4-4-9.5 9.5-2 4 4-2L21 6.5zM3 17.25V21h3.75L17.81 9.94l-3.75-3.75L3 17.25z"/>'
    :'<path d="M17 10.5V7c0-.55-.45-1-1-1H4c-.55 0-1 .45-1 1v10c0 .55.45 1 1 1h12c.55 0 1-.45 1-1v-3.5l4 4v-11l-4 4z"/>';
  document.getElementById('camTip').textContent=camOff?'Вкл. камеру':'Выкл. камеру';
  refreshOv('local',localStream);
};

document.getElementById('scrBtn').onclick=async()=>{
  if(screenSharing){
    screenStream.getTracks().forEach(t=>t.stop());screenStream=null;screenSharing=false;
    document.getElementById('scrBtn').className='cb off';
    const vt=localStream.getVideoTracks()[0];
    if(vt)for(const p of Object.values(peers)){
      const s=p.pc.getSenders?.().find(s=>s.track?.kind==='video');
      if(s)s.replaceTrack(vt).catch(()=>{});
    }
    const lv=document.querySelector('#tile-local video');
    if(lv)lv.srcObject=localStream;
  }else{
    try{
      screenStream=await navigator.mediaDevices.getDisplayMedia({video:true,audio:true});
      screenSharing=true;
      document.getElementById('scrBtn').className='cb act';
      const st=screenStream.getVideoTracks()[0];
      for(const p of Object.values(peers)){
        const s=p.pc.getSenders?.().find(s=>s.track?.kind==='video');
        if(s)s.replaceTrack(st).catch(()=>{});
      }
      const lv=document.querySelector('#tile-local video');
      if(lv)lv.srcObject=screenStream;
      st.onended=()=>document.getElementById('scrBtn').click();
    }catch{}
  }
};

document.getElementById('lvBtn').onclick=()=>{
  try{ws?.close();}catch{}
  for(const p of Object.values(peers))try{p.pc.close();}catch{}
  localStream?.getTracks().forEach(t=>t.stop());
  location.reload();
};
</script>
